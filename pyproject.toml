[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "muTopOpt"
authors = [
    { name = "Martin Ladecky", email = "martin.ladecky@imtek.uni-freiburg.de" },
    { name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de" },
]
description = "FFT-accelerated FE topology optimization of mechanical metamaterials, built on muGrid"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "numpy",
    # 1.5.2 is the first release that detects GPU-aware MPI with any MPI
    # library that reports it and stages plain device memory on an APU by
    # itself, which muTopOpt used to arrange through environment variables.
    "muGrid>=1.5.2",
    "muTimer",
    "NuMPI",
]

[project.optional-dependencies]
test = ["pytest"]
scipy = ["scipy"]  # for the alternative serial optimize_lbfgs
mpi = ["mpi4py"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "muTopOpt/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/muTopOpt", "/simulate.py", "/simulate_conduction.py"]

[tool.hatch.build.targets.wheel]
packages = ["muTopOpt"]
