[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "muTopOpt"
authors = [
    { name = "Martin Ladecky", email = "martin.ladecky@imtek.uni-freiburg.de" },
    { name = "Lars Pastewka", email = "lars.pastewka@imtek.uni-freiburg.de" },
]
description = "FFT-accelerated FE topology optimization of mechanical metamaterials, built on muGrid"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "numpy",
    # 1.6.0 is the first release that starts MPI itself
    # (Communicator.world(), node_rank for GPU placement, no mpi4py needed),
    # detects GPU-aware MPI with any MPI library that reports it, and stages
    # plain device memory on an APU by itself.
    "muGrid>=1.6.0",
    "muTimer",
    # The optimizers reduce over the muGrid communicator through NuMPI's
    # communicator protocol, which releases after 0.15.2 provide.
    "NuMPI>0.15.2",
]

[project.optional-dependencies]
test = ["pytest"]
scipy = ["scipy"]  # for the alternative serial optimize_lbfgs
mpi = ["mpi4py"]  # not needed for MPI runs; for tools that use it directly

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "muTopOpt/_version.py"

[tool.hatch.build.targets.sdist]
include = ["/muTopOpt", "/simulate.py", "/simulate_conduction.py"]

[tool.hatch.build.targets.wheel]
packages = ["muTopOpt"]
